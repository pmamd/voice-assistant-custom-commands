name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1  # Shallow clone for faster checkout

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libsdl2-dev \
          libcurl4-openssl-dev \
          libcjson-dev \
          python3 \
          python3-pip \
          pipx

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          external/whisper.cpp/build
        key: ${{ runner.os }}-build-${{ hashFiles('CMakeLists.txt', 'external/whisper.cpp/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-build-

    - name: Build project
      run: |
        cmake -B build -DWHISPER_SDL2=ON
        cmake --build build -j$(nproc)

    - name: Verify binary exists
      run: |
        test -f build/bin/voice-assistant
        echo "Binary built successfully"

    - name: Verify build artifacts
      run: |
        test -f src/tools/tools.json
        echo "Build artifacts verified"

    - name: Run Python unit tests
      run: |
        python3 -m pip install pyyaml
        # Run unit tests that don't require Wyoming-Piper or llama-server
        python3 -m unittest tests.test_tool_system -v || true

    - name: Upload build artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/CMakeFiles/CMakeError.log
          build/CMakeFiles/CMakeOutput.log
